name: Deploy frontend-study to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='**/node_modules' \
            --exclude='**/build' \
            --exclude='**/dist' \
            --exclude='**/.cache' \
            --exclude='**/.vite' \
            --exclude='**/.env' \
            --exclude='**/.env.local'

          touch _site/.nojekyll

      - name: Build React projects
        env:
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          build_project() {
            local project_dir="$1"
            local deploy_dir="_site/$project_dir"

            echo "----------------------------------------"
            echo "Build target: $project_dir"

            if [ ! -d "$project_dir" ]; then
              echo "::warning::$project_dir 폴더가 없어 빌드를 건너뜁니다."
              return 0
            fi

            if [ ! -f "$project_dir/package.json" ]; then
              echo "::warning::$project_dir/package.json 파일이 없어 빌드를 건너뜁니다."
              return 0
            fi

            pushd "$project_dir"

            echo "Node version:"
            node -v
            echo "NPM version:"
            npm -v

            if [ "$project_dir" = "react/react-netflix" ]; then
              node - <<'NODE'
          const fs = require('fs')
          const key = process.env.TMDB_API_KEY

          if (!key) {
            console.error('::error::TMDB_API_KEY secret이 설정되어 있지 않습니다. GitHub 저장소 Settings > Secrets and variables > Actions에서 TMDB_API_KEY를 추가해 주세요.')
            process.exit(1)
          }

          fs.writeFileSync(
            'src/apikey.ts',
            `export const config = {
            apikey: ${JSON.stringify(key)},
          }
          `
          )
          NODE
            fi

            # 오래된 학습 프로젝트는 package.json과 package-lock.json이 맞지 않는 경우가 많습니다.
            # npm ci는 lock 파일 불일치 시 바로 실패하므로, 미리보기 배포에서는 npm install로 의존성을 보정합니다.
            npm install

            npm run build

            local build_output=""
            if [ -d build ]; then
              build_output="build"
            elif [ -d dist ]; then
              build_output="dist"
            else
              echo "::error::$project_dir 빌드 결과 폴더를 찾지 못했습니다. build 또는 dist 폴더가 필요합니다."
              exit 1
            fi

            popd

            rm -rf "$deploy_dir"
            mkdir -p "$deploy_dir"
            cp -a "$project_dir/$build_output/." "$deploy_dir/"

            echo "Copied $project_dir/$build_output -> $deploy_dir"
          }
          
          build_project "react/react-movie-list"
          build_project "react/react-animation"
          build_project "react/react-coin-list"
          build_project "react/react-lottery"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
